<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="datos">
            <h2>PRACTICA 2</h2>
            <h2>AUX. EMERGENTES I</h2>
            <p><strong>ESTUDIANTE:</strong> Mendoza Quispe Franklin Vladimir</p>
            <p><strong>SEMESTRE:</strong> 6to "C"</p>
            <p><strong>C.I.:</strong> 8342611 L.P.</p>
            <p><strong>R.U.:</strong> 200075653</p>
        </div>
        <div class="calculator">
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="clear" onclick="limpiar()">C</button>
                <button class="backspace" onclick="borrar()">&lt;</button>
                <button class="operator" onclick="agregar('*')">x</button>
                <button class="operator" onclick="agregar('/')">/</button>
                <button onclick="agregar('7')">7</button>
                <button onclick="agregar('8')">8</button>
                <button onclick="agregar('9')">9</button>
                <button class="operator" onclick="agregar('-')">-</button>
                <button onclick="agregar('4')">4</button>
                <button onclick="agregar('5')">5</button>
                <button onclick="agregar('6')">6</button>
                <button class="operator" onclick="agregar('+')">+</button>
                <button onclick="agregar('1')">1</button>
                <button onclick="agregar('2')">2</button>
                <button onclick="agregar('3')">3</button>
                <button class="equals" onclick="calcular()">=</button>
                <button class="zero" onclick="agregar('0')">0</button>
                <button onclick="agregar('.')">.</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
